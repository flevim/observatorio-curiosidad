[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "observatorio"
version = "0.1.0"
description = "Observatorio de la Curiosidad: atención pública en Wikipedia"
requires-python = ">=3.12"
dependencies = ["httpx", "pandas", "numpy", "scipy", "pyarrow", "pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
observatorio = ["report/*.html"]
