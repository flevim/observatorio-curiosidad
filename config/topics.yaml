  - {id: fusion-nuclear, nombre: Fusión nuclear, semilla: {idioma: en, titulo: Nuclear fusion}}
  - {id: taylor-swift, nombre: Taylor Swift, semilla: {idioma: en, titulo: Taylor Swift}}
  - {id: inflacion, nombre: Inflación, semilla: {idioma: en, titulo: Inflation}}
  - {id: dopamina, nombre: Dopamina, semilla: {idioma: en, titulo: Dopamine}}
  - {id: meditacion, nombre: Meditación, semilla: {idioma: en, titulo: Meditation}}
  - {id: telescopio-james-webb, nombre: Telescopio James Webb, semilla: {idioma: en, titulo: James Webb Space Telescope}}
  - {id: bitcoin, nombre: Bitcoin, semilla: {idioma: en, titulo: Bitcoin}}
  - {id: futbol, nombre: Fútbol, semilla: {idioma: en, titulo: Association football}}
